<!DOCTYPE html>
<html>

<head>
    <title>Demand-X API Test</title>
</head>

<body>

    <h1>Demand-X Prediction Test</h1>

    <button onclick="predictSales()">
        Predict Sales
    </button>

    <h2 id="result"></h2>

    <script>

        async function predictSales() {

            const response = await fetch('http://127.0.0.1:5000/api/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    Item_Weight: 12.5,
                    Item_Fat_Content: 1,
                    Item_Visibility: 0.05,
                    Item_Type: 3,
                    Item_MRP: 250,
                    Outlet_Identifier: 2,
                    Outlet_Establishment_Year: 2005,
                    Outlet_Size: 1,
                    Outlet_Location_Type: 2,
                    Outlet_Type: 1,
                    Profit: 1200
                })
            });

            const data = await response.json();

            document.getElementById("result").innerText =
                "Predicted Sales: " + data.predicted_sales;
        }

    </script>

</body>

</html>
